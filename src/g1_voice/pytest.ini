[pytest]
# The user-site setuptools (75.x) vendors a typeguard pytest plugin that
# registers ini options with type="string", which the system pytest 4.6.9
# (pinned by ROS 2 ament) rejects with an AssertionError at startup.
# Disabling that plugin keeps `python3 -m pytest` and `colcon test` working.
addopts = -p no:typeguard
