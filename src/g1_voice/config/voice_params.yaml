/llm_node:
  ros__parameters:
    api_url: "http://localhost:11434/v1"      # Ollama OpenAI-compatible endpoint
    api_key: "no_key"
    api_model: "llama3.2"
    system_prompt: "You are Aletta, a friendly humanoid robot by Unitree Robotics. Currently you are being researched and worked upon by the SMART Research Group at Saxion University of Applied Sciences at Enschede, The Netherlands. Keep ALL responses under 2 sentences. You are speaking out loud, be concise."
    temperature: 0.7
    max_history_length: 10
    stream: false                             # keep false for TTS compatibility

/stt_node:
  ros__parameters:
    use_udp_mic: false                        # dev machine: use local sounddevice mic
    continuous_mode: false
    model_size: "base"
    language: "en"
    device: "cpu"
    sample_rate: 16000
    recording_duration: 5.0
    silence_threshold: 0.01
    silence_duration: 1.5
    max_no_speech_prob: 0.5
    language_detection_min_probability: 0.55

/wake_word_node:
  ros__parameters:
    wake_phrases: ["hey robot", "cześć robot"]
    wake_phrase_aliases: ["czesc robot", "cześ robot"]
    wake_model_size: "base"
    wake_language: "auto"
    wake_initial_prompt: "Hey robot. Cześć robot. Czesc robot."
    sample_rate: 16000
    wake_chunk_duration: 3.0
    use_udp_mic: false
    use_select_button: true
    select_key: "s"

/tts_node:
  ros__parameters:
    voice_model_path: "/home/asmn/.local/share/piper/en_US-lessac-medium.onnx"
    polish_voice_model_path: "/home/asmn/.local/share/piper/pl_PL-gosia-medium/pl_PL-gosia-medium.onnx"
    use_cuda: true
    output_device: 5                          # unused: playback goes via native g1_audio_worker (AudioHub)
    output_sample_rate: 44100
    tts_mode: "python"                        # 'python' (piper pip pkg) or 'binary' (standalone piper)
