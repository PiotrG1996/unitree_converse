# Dev machine (ROS 2 Humble, no G1): local mic, CPU Whisper, local playback
# (g1_audio_worker reports no native audio and tts_node falls back to aplay).

/llm_node:
  ros__parameters:
    api_url: "http://localhost:11434/v1"
    api_key: "no_key"
    api_model: "llama3.2"
    system_prompt: "You are Aletta, a friendly humanoid robot by Unitree Robotics, researched at Poznan University of Technology, Poland. You are speaking out loud: keep every reply under 2 sentences."
    temperature: 0.7
    max_history_length: 6
    stream: true

/stt_node:
  ros__parameters:
    use_udp_mic: false        # sounddevice default input
    device: "cpu"
    continuous_mode: false
    recording_duration: 8.0

/wake_word_node:
  ros__parameters:
    aletta_threshold: 0.8     # needs the G1 UDP mic; idle without it

/tts_node:
  ros__parameters:
    tts_mode: "python"        # pip install piper-tts
    continuous_mode: false

/button_trigger_node:
  ros__parameters:
    custom_say_text: "Hello! I am Aletta, a humanoid robot assistant at Poznan University of Technology. I am here to support researchers, students, and academic staff in their daily activities. I can assist with research-related tasks, provide information, answer questions, and help you explore new ideas in science and technology. Whether you are conducting research, working on a project, or simply curious about robotics and artificial intelligence, I am happy to help. My goal is to make your work easier, support scientific collaboration, and contribute to an innovative research environment. Welcome to Poznan University of Technology! How can I assist you today?"

# --------------------------------------------------------------------------
# Environment Variable Overrides (for concurrent GPU/memory deployment)
# --------------------------------------------------------------------------
# These env vars allow runtime reconfiguration without editing YAML,
# useful when running alongside other autonomous applications (navigation,
# perception) that occupy GPU VRAM.
#
#   export STT_DEVICE=cpu       # Force STT to use CPU Whisper
#   export TTS_MODE=python      # Force TTS to use CPU Piper mode
#   export LLM_NGL=0            # Force LLM to CPU only (llama.cpp)
#
# When running on Orin NX with other GPU-heavy stacks, set these before
# launching the voice pipeline, e.g.:
#
#   export STT_DEVICE=cpu
#   export TTS_MODE=python
#   ros2 launch g1_voice voice_real.launch.py
#
# Defaults (no env set) preserve existing behavior.
# --------------------------------------------------------------------------
