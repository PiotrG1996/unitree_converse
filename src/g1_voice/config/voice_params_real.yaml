
/llm_node:
  ros__parameters:
    api_url: "http://localhost:11434/v1"
    api_key: "no_key"
    api_model: "llama3.2"

    system_prompt: 
      "You are Aletta, a friendly humanoid robot developed by Unitree
      Robotics. You are part of a PhD research project carried out by
      Piotr Gapski at Poznań University of Technology in Poland.

      LANGUAGE:
      Reply in the language of the latest user utterance, using only
      Polish or English. Use natural, grammatically correct Polish
      with proper diacritics, or clear, natural English. Do not switch
      languages unnecessarily. If the language is unclear, ask a brief
      clarification in Polish or English.

      ROBOT STATE:
      You may receive live robot-state information in [ROBOT STATE]
      blocks. Use only relevant information from these blocks to answer
      the user's specific questions. Do not volunteer diagnostics or
      connectivity information. Never invent sensor readings, robot
      capabilities, or operating conditions. If information is missing,
      stale, contradictory, or insufficient, say so briefly.

      SAFETY:
      Never claim that a physical action has been completed unless
      execution is confirmed by an authoritative source. Do not imply
      that conversational instructions override hardware-level safety
      mechanisms. If an ambiguous request could cause unsafe movement,
      ask for clarification.

      SPEECH:
      Keep responses concise and natural for spoken interaction.
      Prefer one sentence and use no more than two sentences unless
      essential safety information requires additional explanation.
      Avoid unnecessary lists, technical details, and repetition."

    temperature: 0.4
    max_history_length: 0
    # stream: false
    stream: true

    # Hard output cap to reduce generation and TTS latency.
    max_tokens: 90


/stt_node:
  ros__parameters:
    use_udp_mic: true
    # Default: the robot waits for the wake word "Aletta" (or F1 on the
    # pad). Sessions open only via "Aletta" — START can merely end one.
    # boot_kick_delay=0 disables boot auto-listen; watchdog_interval=15 keeps
    # the gated idle wait at ~zero CPU (no STT/LLM work while waiting).
    continuous_mode: false
    watchdog_interval: 15.0
    boot_kick_delay: 0.0

    udp_multicast_group: "239.168.123.161"
    udp_port: 5556
    udp_local_ip: "192.168.123.164"

    # NOTE: STT uses port 5556 while wake_word_node uses 5555. Both join the
    # same multicast group; the audio source must multicast to both ports so
    # neither socket starves the other of datagrams (see wake_word_node.py
    # _wake_word_loop and stt_node.py _record_via_udp for the SO_REUSEADDR
    # port-contention rationale).
    # Baseline: benchmark against small on the target Jetson.
    model_size: "base"
    language: "en"
    device: "cuda"
    beam_size: 5
    initial_prompt: ""
    vad_threshold: 0.3
    vad_min_silence_ms: 500
    vad_speech_pad_ms: 400
    normalize_audio: true

    sample_rate: 16000
    recording_duration: 10.0
    silence_threshold: 0.0072

    # Turn-taking: stop early on trailing silence so the pipeline answers
    # promptly. 2.5s (was 1.0s) so users have time to finish short phrases
    # before the clip is cut. Whisper needs enough speech context to produce
    # confident segments; cutting at 1.0s of silence left mostly-silent clips
    # that decoded to empty transcripts.
    silence_duration: 2.5

    # Tune with recorded speech and silence samples.
    # Raised 0.5 -> 0.85: live logs show real uncertain English speech at
    # no_speech_prob ~0.75 being dropped ("So, we're going to start with the
    # first one."). 0.85 keeps those while still blocking high-confidence
    # noise (>0.85). The _looks_like_noise gate and min_publish_avg_logprob
    # floor (-11.0) provide a second line of defence against noise leaking
    # through.
    max_no_speech_prob: 0.85
    # Lowered 0.75 -> 0.50: Whisper's auto language detection on the noisy
    # UDP mic feed rarely exceeds ~0.55-0.74 even for clear English speech.
    # At 0.75 almost every turn skips the early-accept path and goes to the
    # pl/en duel, where Polish can wrongly override English (the wake word
    # "Aletta" is English). At 0.50, moderately-confident English auto
    # detections are accepted directly, avoiding Polish flips.
    language_detection_min_probability: 0.50

    # Duel safety (2026-10-16 incident: noise turned into Polish replies).
    # A forced-language candidate may replace the auto pass only when its
    # score beats the auto pass by this margin (logprob units). Evidence:
    # 5/7 duels returned pl when auto said en (incl. en probability=0.75),
    # because forced-pl decodes of non-speech loop long and confidently.
    # Genuine forced-language separation on real speech far exceeds 0.25.
    language_duel_override_margin: 0.25
    # Publish floor: transcripts whose kept segments average below this
    # avg_logprob are dropped. Raised from -2.5 to -11.0: live logs show real
    # English speech ("That's nice warm...", "That piece went into the next one.")
    # at avg_logprob ~-10.0 being dropped because the UDP mic feed is noisy and
    # Whisper is uncertain. -11.0 keeps noisy-but-real speech while still
    # blocking extreme garbage (avg_logprob < -11, e.g. -15, -20 on pure noise).
    # The _looks_like_noise gate and language duel provide a second line of
    # defence against noise leaking through.
    min_publish_avg_logprob: -11.0
    # TTS echo guard: while the robot speaks (and this long after), the mic
    # hears its own Piper voice on the head-mounted speaker. STT defers
    # watchdog/trigger opens during the guard so it never transcribes its
    # own reply as a new user turn (sentence-repetition loop).
    tts_echo_guard_sec: 2.5


/wake_word_node:
  ros__parameters:
    # Sole voice trigger: "Aletta" via the custom openWakeWord model.
    # Pad buttons (F1/START/SELECT) via button_trigger_node are the only
    # other triggers. No Whisper phrase matching, no keyboard trigger.
    # use_udp_mic: true on the robot (UDP mic stream from the G1).
    sample_rate: 16000
    # openWakeWord 0.6.0 exports ONNX only (tflite conversion needs
    # tensorflow + onnx_tf, not installed on the robot). setup.sh downloads
    # BOTH base-feature variants; the detector picks the .onnx pair to match
    # this framework.
    aletta_model_path: "~/.local/share/openwakeword/aletta_v0.1.onnx"
    aletta_framework: "onnx"
    # Raised from 0.85 — synthetic-only model keys on Piper voice timbre,
    # so ambient/noise frames still cross 0.85 (~46% false-accept). 0.95
    # rejects most noise while keeping strong real "Aletta" utterances.
    aletta_threshold: 0.98
    # Raised from 2 to 4 — requires ~320 ms of sustained above-threshold
    # frames instead of 160 ms. Real speech holds high scores; noise spikes
    # rarely persist across four consecutive 80 ms frames.
    min_consecutive_frames: 5
    # Echo guard: while TTS speaks (and for this long after) the mic hears
    # the robot's own Piper voice — drain audio without scoring so the model
    # cannot self-trigger on playback. Extended to 2.0 s for the synthetic
    # model which is especially prone to self-trigger on its own playback.
    echo_guard_sec: 2.5
    # Base openWakeWord feature models (resolved at runtime to
    # ~/.local/share/openwakeword/ when empty). Empty = portable default.
    oww_melspec_model_path: ""
    oww_embedding_model_path: ""
    use_udp_mic: true
    udp_multicast_group: "239.168.123.161"
    udp_port: 5555
    udp_local_ip: "192.168.123.164"

    idle_sleep_sec: 1.5
    # RMS energy gate: frames below this int16 RMS are skipped before ONNX
    # scoring. 300 rejects quiet room noise/HVAC that the synthetic model
    # scores ~0.99.
    silence_rms: 350.0
    base_cooldown_sec: 4.0
    # False-accept backoff: when a wake-opened session times out with no
    # speech, multiply cooldown by this factor (caps at 15s). Resets on real
    # activity. Reduced from 2.0/60s to make queued wakes more likely to fire.
    false_accept_backoff_multiplier: 1.25
    max_false_accept_cooldown: 15.0


/button_trigger_node:
  ros__parameters:
    # Fixed phrase spoken when the SELECT pad button (bit 3, value 8)
    # is pressed. Published on /g1/voice/say_text and spoken by tts_node,
    # bypassing STT/LLM. Edit the text here — no code change needed.
    custom_say_text: "Hello! I am Aletta, a humanoid robot assistant at Poznan University of Technology. I am here to support researchers, students, and academic staff in their daily activities. I can assist with research-related tasks, provide information, answer questions, and help you explore new ideas in science and technology. Whether you are conducting research, working on a project, or simply curious about robotics and artificial intelligence, I am happy to help. My goal is to make your work easier, support scientific collaboration, and contribute to an innovative research environment. Welcome to Poznan University of Technology! How can I assist you today?"

/tts_node:
  ros__parameters:
    voice_model_path: "/home/unitree/.local/share/piper/en_US-lessac-medium.onnx"
    polish_voice_model_path: "/home/unitree/.local/share/piper/pl_PL-gosia-medium/pl_PL-gosia-medium.onnx"

    # Matches /stt_node: default is wake-word ("Aletta") gated; the wake
    # word node enables the listen-again loop when a session opens.
    continuous_mode: false
    use_cuda: false

    # Playback is handled by the native G1 AudioHub worker.
    output_device: -1
    output_sample_rate: 44100

    tts_mode: "binary"

    # Mirrors /llm_node's `stream` flag: when true, TTS speaks incremental
    # llm_stream sentence chunks as they arrive (works in both PL and EN);
    # llm_response then only flushes the tail. Must stay in sync with the
    # llm_node block, otherwise streaming deltas arrive but are never
    # enqueued (or vice versa). Default True to match llm_node.
    stream: true

    # Benchmark 0.80 against 0.88 for intelligibility and naturalness.
    length_scale: 0.80

    piper_binary: "/home/unitree/.local/piper-bin/piper"
    piper_lib_dir: "/home/unitree/.local/piper-bin"

    network_interface: "eth0"


