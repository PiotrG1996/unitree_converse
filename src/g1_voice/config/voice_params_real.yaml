# On-robot (Jetson, ROS 2 Foxy) parameters. Every key here is read by a node;
# defaults for anything omitted live in the node source.

/llm_node:
  ros__parameters:
    api_url: "http://localhost:11434/v1"
    api_key: "no_key"
    api_model: "llama3.2"
    system_prompt:
      "You are Aletta, a friendly humanoid robot (Unitree G1) in a PhD
      research project by Piotr Gapski at Poznań University of Technology.

      RULES:
      1. The user's words come from speech recognition and are sometimes
      misheard. If a message is a fragment or makes no sense, briefly ask
      the user to repeat it. Never guess or invent a topic.
      2. Messages often start with your name, Aletta. That is only how the
      user addresses you.
      3. Reply in the language of the latest message (Polish or English),
      with correct Polish diacritics.
      4. In this mode you cannot move, walk or handle objects. Never say you
      did or will do a physical action.
      5. Use the [ROBOT STATE] block only when the user asks about you
      (battery, network, uptime) or the time. Never invent values that are
      not in it.
      6. You are speaking out loud: answer in one short sentence, at most
      two. No lists."

    temperature: 0.4
    max_history_length: 1     # current question only: a misheard turn in the history
                              # derails later answers (3B model). 0 = unlimited.
    stream: true              # tts_node speaks sentences as they stream in
    max_tokens: 90

/stt_node:
  ros__parameters:
    use_udp_mic: true         # G1 mic: RockChip UDP multicast
    udp_multicast_group: "239.168.123.161"
    udp_port: 5555            # same port as wake_word_node (SO_REUSEADDR)
    udp_local_ip: "192.168.123.164"
    continuous_mode: false    # wake_word_node turns this on per session
    watchdog_interval: 20.0   # session: listen again if no reply re-triggers us
    # medium (int8) transcribes, small does the language-ID pass: on 5 clean recorded
    # questions 4/5 right vs 1/5 with small alone, for +1.0 s per turn (0.47 s language
    # ID + 1.6 s decode) and ~1 GB more memory. Back to small alone: model_size "small",
    # compute_type "", language_id_model "".
    model_size: "medium"
    compute_type: "int8_float16"
    language_id_model: "small"
    # Whisper vocabulary hint per language (default: robot/lab words for English;
    # none for Polish, where it did not help). Words only, never example questions.
    # initial_prompt_en: "Aletta, Unitree G1, battery, charging, ROS 2, nodes, ..."
    # initial_prompt_pl: ""
    device: "cuda"            # GPU only (float16); fails loudly if CUDA is broken
    language: "auto"          # or "en" / "pl" to skip language detection
    beam_size: 5
    max_new_tokens: 100       # cap per decode: a "Thank you." x28 loop took 3.0 s to decode
    vad_threshold: 0.3
    vad_speech_pad_ms: 400
    normalize_audio: true
    recording_duration: 10.0  # max seconds of speech, counted from when you start talking
    max_wait_for_speech: 8.0  # silence before speech that ends an empty turn
    silence_threshold: 0.010  # RMS (=330 int16) that still counts as speech once a turn started (word endings)
    speech_start_threshold: 0.02  # RMS (=655) needed to START a turn: room 0.005, robot echo tail <= 0.013,
                                  # a person 0.03-0.13. At 0.010 noise and the echo tail started turns.
    silence_duration: 1.2     # trailing silence that ends a turn (was 2.5: +1.3 s per reply)
    max_no_speech_prob: 0.85  # drop Whisper segments above this
    min_avg_logprob: -1.0     # drop segments Whisper is unsure of: real turns -0.66..-0.88,
                              # invented ones ("God bless you all...") -1.01..-1.22. 0.0 = off
    noisy_no_speech_prob: 0.5   # ...and a segment with no-speech score above 0.5 must reach
    noisy_min_avg_logprob: -0.7 # logprob -0.7 (distant talk/noise: 0.58-0.65 / -0.79..-0.93)
    mic_ring_sec: 4.0         # rolling mic buffer: wake turns start right after "Aletta"
    wake_audio_offset_sec: 1.5  # a wake-started turn looks back this far (the detection comes 0.3-1.0 s
                                # after "Aletta"); the name is then cut at the pause after it
    wake_trim_offset_sec: 0.2 # "Aletta" said mid-turn: cut audio up to 0.2 s before the detection
    wake_trim_max_sec: 1.5    # ...only if that cut is within 1.5 s of the speech onset
    tts_echo_guard_sec: 2.5   # never open the mic within this of speaker playback...
    echo_tail_sec: 0.3        # ...but take the turn's audio from 0.3 s after the speaker stopped
                              # (rolling buffer): people answer at once, and the echo is gone in 0.1 s
    board_play_state_topic: "/audio_msg"  # audio board {"play_state":0|1}: also guards against
                                          # Unitree's built-in assistant voice ('' = our TTS only)
    debug_audio_dir: "/tmp/stt_turns"  # save each turn's audio + decode info ('' = off)

/wake_word_node:
  ros__parameters:
    aletta_model_path: "~/.local/share/openwakeword/aletta_v0.1.onnx"
    aletta_framework: "onnx"  # openWakeWord 0.6 exports ONNX only
    aletta_threshold: 0.8     # tune with wakeword_training/scripts/eval_*
    takeover_from_unitree: false  # online (Unitree GPT answers): ignore "Aletta"; true = "Aletta"
                                  # switches to Aletta until her session ends
    refractory_sec: 1.5       # one "Aletta" scores twice ~1.1-1.3 s apart: ignore hits this close
    min_consecutive_frames: 2 # 2 x 80 ms frames above threshold (real "Aletta" holds >= 0.9 for 1 s+)
    min_rms: 400.0            # int16 RMS the last 2 s must peak at (room ~350)
    energy_window_sec: 2.0    # wake score peaks ~1 s after the word: look back
    echo_guard_sec: 1.5       # ignore detections during/after speaker playback (covers the model's
                              # ~1.3 s window, so "Aletta" right after a reply can still be cut out)
    board_play_state_topic: "/audio_msg"  # see stt_node
    udp_multicast_group: "239.168.123.161"
    udp_port: 5555
    udp_local_ip: "192.168.123.164"
    session_max_duration_sec: 300.0
    max_empty_turns: 4        # consecutive turns without transcript close it
    base_cooldown_sec: 4.0    # min gap between wake-opened sessions
    false_accept_backoff_multiplier: 1.5  # per session that had no transcript
    max_false_accept_cooldown: 30.0

/tts_node:
  ros__parameters:
    voice_model_path: "/home/unitree/.local/share/piper/en_US-lessac-medium.onnx"
    polish_voice_model_path: "/home/unitree/.local/share/piper/pl_PL-gosia-medium/pl_PL-gosia-medium.onnx"
    tts_mode: "binary"        # standalone Piper; "python" uses piper-tts
    piper_binary: "/home/unitree/.local/piper-bin/piper"
    piper_lib_dir: "/home/unitree/.local/piper-bin"
    length_scale: 0.8         # <1 speaks faster
    first_clause_words: 5     # speak the first clause (", ") early once it has 5+ words; 0 = off
    continuous_mode: false    # wake_word_node turns this on per session
    network_interface: ""     # "" = the interface holding 192.168.123.164

/assistant_mode_node:
  ros__parameters:
    # Unitree's built-in cloud GPT assistant (service chat_go, male English voice):
    #   "off"   Aletta only; chat_go is switched off and kept off (default)
    #   "auto"  Unitree's assistant while the robot reports internet, Aletta offline
    #   "leave" Aletta only; chat_go is never touched (both may answer)
    unitree_assistant: "auto"   # robot on Wi-Fi: official Unitree GPT (English); offline: Aletta
    unload_llm_online: true     # unload Ollama's model while Unitree answers (frees ~2-3 GB)
    online_stable_sec: 10.0   # auto: robot online this long before handing over
    network_timeout_sec: 30.0 # auto: no /public_network_status this long = offline

/button_trigger_node:
  ros__parameters:
    custom_say_text: "Hello! I am Aletta, a humanoid robot assistant at Poznan University of Technology. I am here to support researchers, students, and academic staff in their daily activities. I can assist with research-related tasks, provide information, answer questions, and help you explore new ideas in science and technology. Whether you are conducting research, working on a project, or simply curious about robotics and artificial intelligence, I am happy to help. My goal is to make your work easier, support scientific collaboration, and contribute to an innovative research environment. Welcome to Poznan University of Technology! How can I assist you today?"

# --------------------------------------------------------------------------
# Environment Variable Overrides (for concurrent GPU/memory deployment)
# --------------------------------------------------------------------------
# These env vars allow runtime reconfiguration without editing YAML,
# useful when running alongside other autonomous applications (navigation,
# perception) that occupy GPU VRAM.
#
#   export STT_DEVICE=cpu       # Force STT to use CPU Whisper
#   export TTS_MODE=python      # Force TTS to use CPU Piper mode
#   export LLM_NGL=0            # Force LLM to CPU only (llama.cpp)
#
# When running on Orin NX with other GPU-heavy stacks, set these before
# launching the voice pipeline, e.g.:
#
#   export STT_DEVICE=cpu
#   export TTS_MODE=python
#   ros2 launch g1_voice voice_real.launch.py
#
# Defaults (no env set) preserve existing behavior.
# --------------------------------------------------------------------------
