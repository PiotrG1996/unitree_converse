# Phonon TTS Configuration for NVIDIA Jetson Orin NX

jetson:
  model: "Orin NX"
  ram_gb: 16
  power_mode: "max-performance"

nts:
  default_model: "gradium/phonon-31m-en"
  quantization: "f32"
  sample_rate: 24000
  channels: 1
  bit_depth: 16
  frame_duration_ms: 10
  chunk_size: 256
  backend: "auto"

ros2:
  enabled: false
  topic: "/tts/text"
  status_topic: "/tts/status"
  queue_size: 10

performance:
  target_time_to_first_audio_ms: 200
  target_rtf: 0.5
  max_memory_mb: 2048
  max_cpu_percent: 50

audio:
  alsa_card: "default"
  preferred_rate: 24000
  buffer_size: 1024

power:
  allow_power_increase: true
  min_power_mode: "moderate"
  thermal_threshold: 70
